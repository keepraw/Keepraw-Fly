name: Deploy official release to Fork Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Official stable release (explicit opt-in for upgrades)
        required: true
        default: v0.1.1
      custom_domain:
        description: Optional DNS hostname configured in your Pages settings
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-pages
  cancel-in-progress: false

jobs:
  download:
    if: github.event.repository.fork && github.repository != 'keepraw/Keepraw-Fly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Download and verify official static files (no source build)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/keepraw/Keepraw-Fly/releases/tags/$VERSION" > release.json
          jq -e --arg tag "$VERSION" '.author.login == "keepraw" and .tag_name == $tag and .draft == false and .prerelease == false' release.json
          mkdir download site
          # v0.1.0 was published before release provenance attestations; it is
          # only checksum-verified and is never reported as attested.
          legacy_unattested=" v0.1.0 "
          if [[ $legacy_unattested == *" $VERSION "* ]]; then
            gh release download "$VERSION" --repo keepraw/Keepraw-Fly --dir download \
              --pattern "keepraw-fly-$VERSION.tar.gz" --pattern SHA256SUMS
            echo "::warning::$VERSION predates provenance attestations; only SHA-256 checksums from the same release were verified."
          else
            gh release download "$VERSION" --repo keepraw/Keepraw-Fly --dir download \
              --pattern "keepraw-fly-$VERSION.tar.gz" --pattern SHA256SUMS \
              --pattern provenance.json --pattern attestation.sigstore.json
          fi
          cd download
          awk -v file="keepraw-fly-$VERSION.tar.gz" '$2 == file || $2 == "./" file {print}' SHA256SUMS > selected.sha256
          [[ $(wc -l < selected.sha256) == 1 ]]
          sha256sum -c selected.sha256
          if [[ -f attestation.sigstore.json ]]; then
            # gh < 2.102.0 matched signer identities by prefix (GHSA-wjmr-j3rp-mh2g).
            gh_version=$(gh --version | sed -n 's/^gh version \([0-9][0-9.]*\).*/\1/p' | head -n1)
            [[ $(printf '2.102.0\n%s\n' "$gh_version" | sort -V | head -n1) == 2.102.0 ]] \
              || { echo "::error::gh $gh_version cannot verify provenance safely (need >= 2.102.0)"; exit 1; }
            awk '$2 == "provenance.json" || $2 == "./provenance.json" {print}' SHA256SUMS | sha256sum -c
            revision=$(jq -er '.revision' provenance.json)
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            jq -e --arg version "${VERSION#v}" '.version == $version and .author == "keepraw"' provenance.json
            ref=$(gh api "repos/keepraw/Keepraw-Fly/git/ref/tags/$VERSION" --jq '.object.type + " " + .object.sha')
            tag_sha=${ref#* }
            [[ ${ref%% *} != tag ]] || tag_sha=$(gh api "repos/keepraw/Keepraw-Fly/git/tags/$tag_sha" --jq .object.sha)
            [[ "$tag_sha" == "$revision" ]] || { echo "::error::$VERSION tag ($tag_sha) and provenance ($revision) disagree"; exit 1; }
            for file in "keepraw-fly-$VERSION.tar.gz" provenance.json; do
              gh attestation verify "$file" --bundle attestation.sigstore.json --repo keepraw/Keepraw-Fly \
                --cert-identity https://github.com/keepraw/Keepraw-Fly/.github/workflows/release.yml@refs/heads/main \
                --source-ref refs/heads/main --source-digest "$revision" --deny-self-hosted-runners > /dev/null \
                || { echo "::error::Provenance verification failed for $file; refusing to deploy"; exit 1; }
            done
            echo "Verified provenance of $VERSION from keepraw/Keepraw-Fly release.yml at $revision" >> "$GITHUB_STEP_SUMMARY"
          fi
          tar -xzf "keepraw-fly-$VERSION.tar.gz" -C ../site
          cd ../site
          sha256sum -c FILES.sha256 > /dev/null
          jq -e --arg version "${VERSION#v}" '.version == $version and .author == "keepraw"' release.json
          rm -f CNAME
          touch .nojekyll
          if [[ -n "$CUSTOM_DOMAIN" ]]; then
            [[ ${#CUSTOM_DOMAIN} -le 253 && "$CUSTOM_DOMAIN" =~ ^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$ ]]
            printf '%s\n' "$CUSTOM_DOMAIN" > CNAME
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    if: github.event.repository.fork && github.repository != 'keepraw/Keepraw-Fly'
    needs: download
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
