name: Refresh mobile Playwright snapshots

on:
  push:
    branches: [codex/mobile-passport-refactor]

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Refresh mobile Passport snapshots
        run: pnpm test:e2e e2e/keepraw-fly.pw.ts -g "keeps the mobile Passport composition visually stable" --update-snapshots

      - name: Upload Linux snapshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-passport-snapshots-linux
          path: e2e/keepraw-fly.pw.ts-snapshots/passport-mobile-*x*-chromium-linux.png
