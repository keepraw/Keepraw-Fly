name: Capture mobile Linux snapshots

on:
  push:
    branches: [codex/mobile-passport-refactor]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture final mobile snapshots on Linux
        run: pnpm test:e2e e2e/keepraw-fly.pw.ts --grep 'keeps the mobile Passport composition visually stable' --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-linux-snapshots
          path: e2e/keepraw-fly.pw.ts-snapshots/passport-mobile-*-chromium-linux.png
          if-no-files-found: error
