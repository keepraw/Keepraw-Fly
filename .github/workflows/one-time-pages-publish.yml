name: One-time Owner-approved Pages publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pages-publish.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: one-time-owner-approved-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'chore: publish current main to Pages once (Owner approved)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      - name: Publish approved snapshot
        id: deployment
        uses: actions/deploy-pages@v5
