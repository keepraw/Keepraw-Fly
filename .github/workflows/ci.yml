name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation consistency
        run: pnpm check:docs

      - name: Check formatting
        run: pnpm format:check

      - name: Lint CSS
        run: pnpm lint:css

      - name: Check CSS token references
        run: pnpm check:css-tokens

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run automated tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full Chromium regression journeys
        run: pnpm test:e2e --project=chromium

      - name: Upload failed Chromium diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Passport mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-mobile-review
          path: test-results/review/passport-mobile-*.png
          if-no-files-found: warn

      - name: Build production site
        run: pnpm build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # Each project selects @cross-browser tests in playwright.config.ts.
      # Keep engine diagnostics independent; Chromium runs all E2E in verify.
      - name: Run cross-browser smoke journeys
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    # Owner pause: PR consolidation must not publish the site automatically.
    # Restore the original main-push condition only with explicit approval.
    if: ${{ false }}
    needs: [verify, cross-browser]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
