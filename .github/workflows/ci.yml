name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
  PLAYWRIGHT_HTML_OPEN: never

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation consistency
        run: pnpm check:docs

      - name: Check formatting
        run: pnpm format:check

      - name: Lint CSS
        run: pnpm lint:css

      - name: Check CSS token references
        run: pnpm check:css-tokens

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run automated tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  chromium:
    runs-on: ubuntu-latest
    # Spread the full regression and responsive Hero checks across runners.
    # Keep one worker per runner and preserve all test/job timeouts and gates.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full Chromium regression journeys
        run: pnpm test:e2e --project=chromium --workers=1 --shard=${{ matrix.shard }}/6 --reporter=list,html,json

      - name: Summarize Chromium results
        if: always()
        run: node scripts/report-playwright.mjs test-results/results.json

      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # Each project selects @cross-browser tests in playwright.config.ts.
      # Keep engine diagnostics independent; Chromium shards run all E2E.
      # A virtual display lets Firefox exercise the actual WebGL scene.
      - name: Run cross-browser smoke journeys
        run: xvfb-run -a pnpm test:e2e --project=${{ matrix.browser }} --workers=1 --reporter=list,html,json

      - name: Summarize browser results
        if: always()
        run: node scripts/report-playwright.mjs test-results/results.json

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Preserve the existing required-check name as a gate over every validation job.
  # always() makes failed/cancelled/skipped dependencies fail this gate explicitly.
  verify:
    needs: [checks, chromium, cross-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
        run: |
          for result in "$CHECKS_RESULT" "$CHROMIUM_RESULT" "$CROSS_BROWSER_RESULT"; do
            if [ "$result" != success ]; then
              echo "Validation did not succeed: $result"
              exit 1
            fi
          done

  deploy:
    # Publish only the validated main commit from this CI run. Pull requests,
    # failed, cancelled, or skipped validation jobs must never deploy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    needs: [verify, checks, chromium, cross-browser]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
