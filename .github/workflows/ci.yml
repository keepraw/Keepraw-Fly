name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
  PLAYWRIGHT_HTML_OPEN: never

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'keepraw/Keepraw-Fly'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check incoming commit identities
        env:
          COMMIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-commit-identities.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation consistency
        run: pnpm check:docs

      - name: Check formatting
        run: pnpm format:check

      - name: Lint CSS
        run: pnpm lint:css

      - name: Check CSS token references
        run: pnpm check:css-tokens

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run automated tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      # Static half: meta CSP == policy source, no inline script or runtime
      # eval in any bundle, Caddy policy parity. The real-Caddy header and cache
      # assertions run inside scripts/test-deployment.sh against the image.
      - name: Check CSP and security-header policy
        run: pnpm check:security-headers

      - name: Package the exact production build
        run: bash scripts/package-release.sh

      - name: Verify release and deployment tooling
        run: bash scripts/test-deployment.sh

      - name: Retain release candidates from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: artifacts/release/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  chromium:
    if: github.repository == 'keepraw/Keepraw-Fly'
    # Keep the hosted runner's font baseline for exact DPR/layout assertions.
    # Its libraries are checked explicitly; no runtime apt install is needed.
    runs-on: ubuntu-24.04
    # Balance whole files by measured duration; discover new files automatically.
    # Keep one worker per runner and preserve all test/job timeouts and gates.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download locked Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Check matching Playwright runtime
        run: node scripts/check-playwright-runtime.mjs chromium

      - name: Run full Chromium regression journeys
        env:
          CI_CHROMIUM_SHARD: ${{ matrix.shard }}/6
        run: pnpm test:e2e --project=chromium --workers=1 --reporter=list,html,json

      - name: Summarize Chromium results
        if: always()
        run: node scripts/report-playwright.mjs test-results/results.json chromium-${{ matrix.shard }}/6

      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-chromium-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser:
    if: github.repository == 'keepraw/Keepraw-Fly'
    runs-on: ubuntu-latest
    # Official runtime includes the matching browsers, fonts and system libraries.
    # Digest pinning avoids mutable tags and per-runner apt/download stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            workers: 1
          - browser: webkit
            workers: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check matching Playwright runtime
        run: node scripts/check-playwright-runtime.mjs ${{ matrix.browser }}

      # Each project selects @cross-browser tests in playwright.config.ts.
      # Keep engine diagnostics independent; Chromium shards run all E2E.
      # WebKit overlaps independent files. Firefox keeps one worker: the
      # two-worker trial had a hover retry and little wall-time benefit.
      # A virtual display lets Firefox exercise the actual WebGL scene.
      - name: Run cross-browser smoke journeys
        run: xvfb-run -a pnpm test:e2e --project=${{ matrix.browser }} --workers=${{ matrix.workers }} --reporter=list,html,json

      - name: Summarize browser results
        if: always()
        run: node scripts/report-playwright.mjs test-results/results.json ${{ matrix.browser }}

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  csp:
    if: github.repository == 'keepraw/Keepraw-Fly'
    runs-on: ubuntu-latest
    # Official runtime includes the matching browsers, fonts and system libraries.
    # Digest pinning avoids mutable tags and per-runner apt/download stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check matching Playwright runtime
        run: node scripts/check-playwright-runtime.mjs ${{ matrix.browser }}

      # Production build + vite preview: the dev server deliberately has no CSP.
      - name: Run CSP and font SRI journeys against the production build
        run: xvfb-run -a pnpm test:e2e:csp --project=${{ matrix.browser }} --reporter=list,json

      - name: Summarize CSP results
        if: always()
        run: node scripts/report-playwright.mjs test-results/results.json csp-${{ matrix.browser }}

      - name: Upload CSP diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-csp-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Preserve the existing required-check name as a gate over every validation job.
  # always() makes failed/cancelled/skipped dependencies fail this gate explicitly.
  verify:
    needs: [checks, chromium, cross-browser, csp]
    if: ${{ always() && github.repository == 'keepraw/Keepraw-Fly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
          CSP_RESULT: ${{ needs.csp.result }}
        run: |
          for result in "$CHECKS_RESULT" "$CHROMIUM_RESULT" "$CROSS_BROWSER_RESULT" "$CSP_RESULT"; do
            if [ "$result" != success ]; then
              echo "Validation did not succeed: $result"
              exit 1
            fi
          done

  deploy:
    # Publish only the validated main commit from this CI run. Pull requests,
    # failed, cancelled, or skipped validation jobs must never deploy.
    if: ${{ github.repository == 'keepraw/Keepraw-Fly' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    needs: [verify, checks, chromium, cross-browser, csp]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
