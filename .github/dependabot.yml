version: 2

updates:
  # The npm ecosystem supports pnpm and discovers workspace manifests from the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Limits apply to version updates; security updates are managed in GitHub Settings.
    open-pull-requests-limit: 3
    groups:
      workspace-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major updates remain individual PRs for manual review.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
